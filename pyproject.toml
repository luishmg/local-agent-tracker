[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-tracker"
version = "0.1.0"
description = "Zero-daemon cost and performance tracker for local AI coding agents (Claude Code, pi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["pricing/data/*.json", "pricing/data/ACTIVE"]
